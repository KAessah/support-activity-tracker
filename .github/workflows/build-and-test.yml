name: Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activity-tracker

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Building docker image
        run: |
          docker build \
            --build-arg COMPOSER_INSTALL_OPTIONS="--optimize-autoloader" \
            -t activity-tracker-api:ci .

      - name: Run test suite in built image (Postgres)
        run: |
          docker run --rm --network host \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_DATABASE=testing \
            -e DB_USERNAME=postgres \
            -e DB_PASSWORD=postgres \
            --entrypoint /var/www/html/vendor/bin/phpunit \
            activity-tracker-api:ci

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activity-tracker-web
    env:
      API_BASE_URL: http://localhost:8000
      SESSION_PASSWORD: ci-placeholder-session-password-0000000

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: activity-tracker-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
